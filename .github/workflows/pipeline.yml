name: clip-pipeline

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC - main run
    - cron: "0 17 * * *"    # 17:00 UTC - second run
  workflow_dispatch:
    inputs:
      source_url:
        description: "Paste 1 or more video URLs, separated by commas - empty = continue with videos already waiting"
        required: false
        default: ""
      auto_approve:
        description: "Publish without asking - UNCHECK to review clips first"
        type: boolean
        required: false
        default: true

# Public repo = unlimited free hosted-runner minutes.
concurrency:
  group: clip-pipeline
  cancel-in-progress: false

permissions:
  contents: write      # commit state + dashboard back to the repo
  actions: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # stay inside the 6h hard limit
    env:
      # Restore rotated tokens saved by a previous run (public repo = never committed)
      STATE_TOKENS: ${{ secrets.STATE_TOKENS }}
      SECRETS_ADMIN_PAT: ${{ secrets.SECRETS_ADMIN_PAT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # URLs pasted in "Run workflow" (empty on scheduled runs). Comma
      # separated; they are stored in state/pending.json and worked through
      # one video per run.
      EXTRA_SOURCE_URL: ${{ inputs.source_url }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      S3_PATH_STYLE: ${{ secrets.S3_PATH_STYLE }}
      S3_PUBLIC_BASE: ${{ secrets.S3_PUBLIC_BASE }}
      NC_URL: ${{ secrets.NC_URL }}
      NC_USER: ${{ secrets.NC_USER }}
      NC_APP_PASSWORD: ${{ secrets.NC_APP_PASSWORD }}
      NC_FOLDER: ${{ secrets.NC_FOLDER }}
      NC_DIRECT_TEMPLATE: ${{ secrets.NC_DIRECT_TEMPLATE }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_APP_ID: ${{ secrets.IG_APP_ID }}
      IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
      TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
      # Postiz: one key for Instagram / Facebook / TikTok / YouTube instead of
      # the three developer apps above. Both blank = the direct APIs are used.
      POSTIZ_URL: ${{ secrets.POSTIZ_URL }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
      # Optional yt-dlp cookies (Netscape format) for age/bot-checked videos.
      YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
      WHISPER_BACKEND: groq

    steps:
      - name: Checkout (with state)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore token store
        run: python -c "from pipeline import tokens; tokens.restore_from_env()"

      - name: Apply the auto-approve choice from the form
        # The checkbox is authoritative whenever it was sent. Comparing strings
        # avoids the trap that `inputs.auto_approve == false` is also true for a
        # run started without inputs (null == false), which would silently
        # stop publishing on every automatically chained run.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.auto_approve != ''
        env:
          AUTO_APPROVE: ${{ github.event.inputs.auto_approve }}
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          value = os.environ["AUTO_APPROVE"].lower() == "true"
          p = pathlib.Path("config/accounts.yaml")
          text = p.read_text(encoding="utf-8")
          wanted = "true" if value else "false"
          # Replace only the one line. A full yaml.safe_dump() round-trip would
          # erase every comment in the file and churn ~40 lines in the state
          # commit on every dispatch.
          new, n = re.subn(r"(?m)^(\s*auto_approve:\s*).*$", r"\g<1>" + wanted, text)
          if n == 0:
              sys.exit("config/accounts.yaml has no posting.auto_approve line to update")
          if new != text:
              p.write_text(new, encoding="utf-8")
              print("auto_approve ->", wanted)
          else:
              print("auto_approve already", wanted)
          PY

      - name: "Stage 1 - take the next video"
        run: python -m pipeline.discover

      - name: "Stage 2 - transcribe"
        run: python -m pipeline.transcribe

      - name: "Stage 3 - select viral moments"
        run: python -m pipeline.select

      - name: "Stage 4 - render vertical clips"
        run: python -m pipeline.render

      - name: "Stage 5 - quality check"
        # Not masked: a clip that fails QA is dropped, and if every clip fails
        # the run must look red instead of quietly producing nothing. Storage
        # and publish still run (if: always()) so the good clips go out.
        run: python -m pipeline.qa

      - name: "Stage 6 - upload to storage"
        if: always()
        run: python -m pipeline.storage

      - name: "Stage 7 - publish to platforms"
        if: always()
        run: python -m pipeline.publish

      - name: "Stage 8 - pull analytics"
        if: always()
        run: python -m pipeline.analytics || true

      - name: "Stage 9 - cleanup sources + clips, prune old state"
        if: always()
        run: python -m pipeline.cleanup --prune-days 30 --remote-days 7

      - name: "Stage 10 - build dashboard"
        if: always()
        run: python -m pipeline.dashboard

      # A late-stage failure (LLM outage, API error) would otherwise lose the
      # video: the runner is thrown away and discover already recorded it as
      # done. Put it back in the waiting list once, so the next run retries it.
      - name: "Queue again any video that did not finish"
        if: always()
        run: python -m pipeline.discover --requeue

      - name: Stage state + dashboard
        if: always()
        run: git add -A

      - name: Scan staged files for leaked secrets
        id: scan
        if: always()
        run: python scripts/scan_secrets.py

      - name: Commit state + dashboard
        # Never push if the secret scan failed. Still commits when an earlier
        # stage failed, so the dashboard shows what happened.
        if: always() && steps.scan.outcome == 'success'
        run: |
          git config user.name "clip-factory-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(state): run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: "How many videos are still waiting"
        id: waiting
        if: always()
        run: |
          n="$(python -m pipeline.discover --pending 2>/dev/null | tail -1)"
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "videos still waiting: $n"

      # One video per run: after this one finished successfully and its state
      # is committed, start a fresh run for the next link. Two runs never
      # overlap because they share the same concurrency group. The chain stops
      # when the waiting list is empty, and a source that fails twice is
      # dropped, so it cannot loop forever. A failed run does NOT chain - that
      # would burn through the whole list while something is broken.
      - name: "Start the next video"
        if: steps.waiting.outputs.count != '0' && steps.waiting.outputs.count != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pipeline.yml --ref "${{ github.ref_name }}"

      - name: Safety net - remove any remaining media
        if: always()
        run: |
          rm -rf work out
          echo "disk after cleanup:"
          df -h . | tail -1

  deploy-dashboard:
    needs: produce-and-publish
    if: always()
    runs-on: ubuntu-latest
    # GitHub keeps one Pages site per repo. Two deployments at the same time
    # delete/overwrite each other's artifact, which is what produces the
    # "No artifacts named github-pages were found" annotation. Serialise them.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure dashboard exists
        run: |
          if [ ! -f docs/index.html ]; then
            echo "no dashboard yet - generating"
            pip install -r requirements.txt
            python -m pipeline.dashboard
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        # GitHub's Pages API is occasionally unreachable for a few seconds
        # ("no artifacts named github-pages were found" /
        # "fetching artifact metadata failed"). deploy-pages v5 retries on its
        # own; if it still fails the dashboard is also committed to docs/, so
        # the next run catches up. A Pages outage must not redden the pipeline.
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20
