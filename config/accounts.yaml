posting:
  max_clips_per_day: 6
  min_gap_minutes: 45
  auto_approve: false
  post_times_utc:
  - 06:30
  - '13:00'
  - '19:30'
storage:
  backend: nextcloud
platforms:
  instagram:
    enabled: true
    require_business_account: true
    share_to_feed: true
    cover_frame_ms: 3500
  facebook:
    enabled: true
    page_only: true
  tiktok:
    enabled: true
    draft_mode: true
    privacy_level: PUBLIC_TO_EVERYONE
    disable_comment: false
    disable_duet: false
    disable_stitch: false
    cover_timestamp_ms: 1000
niches:
  main:
    platforms:
    - instagram
    - tiktok
    - facebook
    hashtag_pool:
    - '#clips'
    - '#fyp'
    - '#viral'
