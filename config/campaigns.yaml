# ---------------------------------------------------------------------------
# CLIPPAIGN CONFIG
#
# In campaign-based clipping (Whop "Content Rewards", contentrewards.com and
# similar reputable marketplaces) the RIGHTS HOLDER provides the source
# videos. You join a campaign, they hand you the long-form files/links, you
# cut them up, you get paid per approved view.
#
# NEVER point `sources` at creators you have no permission for. That is
# infringement, it gets accounts banned, and the platforms pay nothing for
# unoriginal content anyway.
# ---------------------------------------------------------------------------

defaults:
  # auto = crop when the source survives a 9:16 crop (16:9 and squarer),
  #        blurred background when it does not (21:9, letterboxed, ultrawide).
  # crop | fit | split_v | gameplay_bg | auto
  layout: auto
  min_crop_keep: 0.30
  # Where the 9:16 window sits inside a 16:9 frame.
  #   center = middle slice (right for gameplay)
  #   face   = follow the speaker, so a podcast / talking head stays in frame
  #            (pipeline/crop.py; ignores a small webcam face in the corner)
  crop_mode: center
  min_duration: 18          # seconds - most campaigns want >= 15s
  max_duration: 60          # seconds - TikTok sweet spot; raise to 90 for CPM >= 1min campaigns
  # How many clips to cut from one source is decided per video: the model
  # returns as many distinct moments as the transcript genuinely supports.
  # This is only a ceiling so a chatty 75-minute stream cannot produce 30.
  max_clips_per_video: 10

  # ---- captions -----------------------------------------------------------
  # chunk = three words at a time, white words fill with the accent colour as
  # they are spoken (the look most clipped reels use). word = one word at a
  # time. Both use the fonts bundled in assets/fonts.
  caption_style: chunk
  caption_font: Anton              # Anton | Archivo Black
  caption_font_size: 92
  caption_accent: "#FACC15"        # colour the spoken words turn
  caption_color: "#FFFFFF"         # colour before they are spoken
  caption_outline: "#0A0A0F"
  caption_uppercase: true
  # The hook is the big line at the top of the clip.
  hook_font: Archivo Black
  hook_size: 54
  hook_bg: "#7C3AED"               # solid bar behind the hook
  hook_color: "#FFFFFF"
  hook_seconds: 3.4
  hook_y: 300                      # pixels from the top (keep clear of app UI)

  watermark: "@yourhandle"  # REQUIRED by most campaigns - change this
  require_original_audio: true
  trim_silence: true
  # Optional brand logo burned into every clip (some campaigns, e.g. ClipUp,
  # require their logo). Best for CI: commit the PNG and use a repo path.
  #   logo: "assets/brand-logo.png"   # repo path | local:/abs/path | https URL
  #   logo_position: br               # tl | tr | bl | br | tc | bc | center
  #   logo_width: 260                 # pixels wide
  #   logo_opacity: 1.0               # 0.1 - 1.0
  #
  # Stream VODs are hours long. Download only one window (yt-dlp syntax):
  #   source_section: "00:45:00-01:25:00"
  #
  # If you leave source_section unset, discover picks the window for you:
  # it reads the VOD length from metadata and, on Twitch, samples the chat
  # replay to find where the audience reacted most. The busiest
  # `source_window` seconds are downloaded, and the chat spikes are handed
  # to the moment picker as hints. Default 4500 (75 min), capped at 7200.
  #   source_window: 4500
  #
  # `rules` and `keywords` steer which moments the LLM picks. Use them when a
  # campaign requires the product to be mentioned or shown:
  #   keywords: ["puffco", "puffco peak"]

campaigns:
  # --- Example: replace with real campaigns you join ---
  - id: example-podcast
    name: "Example Podcast (Content Rewards)"
    enabled: false
    source_type: yt-dlp              # yt-dlp | http | local
    sources:
      - "https://www.youtube.com/watch?v=REPLACE_ME"
    # local sources are read from the laptop only:
    # - "local:C:/clips/sources/podcast_ep42.mp4"
    rate_cpm: 1.50                   # $ per 1000 approved views (for reporting)
    payout_model: cpm                # cpm | per_post | pool
    required_hashtags:
      - "#podcastclips"
    watermark: "@yourhandle"
    layout: split_v                  # speaker top / gameplay bottom
    crop_mode: face                  # keep the speaker centred
    # Optional: a rights-cleared gameplay clip to use as the bottom half
    # (many campaigns supply one). Leave null to use `crop` instead.
    gameplay_source: null
    max_duration: 60
    rules: "Min 20s. Must keep original audio. Add hook text. No re-upload of other clippers' edits."

  # --- LIVE: BenDaDonnn x Puffco (Launched Clipping, $10K pool, CPM) ---
  # Pays $1.00 / 1K views, min payout $2.00 (2,000 views), max $400 per clip.
  # Platforms: Facebook, Instagram, TikTok, X, YouTube.
  # Source VOD is 2h35m; we take the first 75 min because (a) the brief wants
  # first-reaction / first-hit content and (b) Groq's free Whisper tier allows
  # ~2h of audio per hour, so a longer window risks falling back to CPU mode.
  - id: bendadonn-puffco
    name: "BenDaDonnn x Puffco GTA 6"
    enabled: true
    source_type: yt-dlp
    sources:
      - "https://www.twitch.tv/videos/2933247628"
    source_section: "00:00:00-01:15:00"
    rate_cpm: 1.00
    payout_model: cpm
    max_clips_per_video: 10            # ceiling only - the model picks the real number
    min_duration: 18
    max_duration: 60
    layout: auto                       # 16:9 stream -> crop; ultrawide -> blurred bg
    caption_style: chunk
    watermark: ""                      # campaign asks for no watermark
    required_hashtags: []
    # Fed to the moment picker so it targets the brief, not random chatter.
    keywords: ["puffco", "puffco peak", "proxy", "hash butler", "jar", "clouds", "dab", "hits"]
    # The brief pays for Puffco content, so a clip that never says the product
    # is worthless even if it is a great moment. Moments that do not mention a
    # keyword are dropped (unless nothing at all mentions it).
    must_mention: true
    rules: >
      Only moments from Ben's Puffco GTA stream. Positive moments only:
      genuine first-hit and in-session reactions, natural wonder and energy at
      GTA, clouds / big hits, impressed moments where Ben or chat is hyped,
      tips and banter about the Hash Butler, and any shoutout or positive
      energy toward Puffco. Never use complaints, weak hits, frustration,
      negative framing of the device or sponsor, gambling (slots, blackjack),
      or anything highly offensive.

